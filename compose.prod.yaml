services:
  mercure:
    command: /usr/bin/caddy run --config /etc/caddy/Caddyfile
    environment:
      SERVER_NAME: ":80"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
