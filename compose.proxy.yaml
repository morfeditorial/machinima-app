services:
  database:
    networks:
      - proxy-net
    ports: []
  mercure:
    networks:
      - proxy-net
    ports: []
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: machinima-app
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - ./.env:/app/.env:ro
      - ./.env.local:/app/.env.local:ro
    depends_on:
      - database
      - mercure
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
